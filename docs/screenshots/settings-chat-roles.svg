<svg width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="960" height="560" fill="#0f1117"/>
  <!-- topbar -->
  <rect x="0" y="0" width="960" height="48" fill="#0f1117"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e2640" stroke-width="1"/>
  <text x="24" y="22" font-size="12" fill="#475569">Settings  /</text>
  <text x="92" y="22" font-size="12" fill="#94a3b8">Chat roles</text>
  <text x="24" y="40" font-size="16" font-weight="700" fill="#f1f5f9">Chat Roles Configuration</text>

  <!-- Settings sidebar -->
  <rect x="0" y="48" width="220" height="512" fill="#161b2e"/>
  <line x1="220" y1="48" x2="220" y2="560" stroke="#1e2640" stroke-width="1"/>
  <text x="20" y="80" font-size="10" fill="#475569" font-weight="700" letter-spacing="0.5">GENERAL</text>
  <text x="20" y="102" font-size="13" fill="#64748b">Workspace</text>
  <text x="20" y="124" font-size="13" fill="#64748b">Notifications</text>
  <text x="20" y="146" font-size="13" fill="#64748b">Integrations</text>
  <text x="20" y="168" font-size="10" fill="#475569" font-weight="700" letter-spacing="0.5">TEAM</text>
  <text x="20" y="190" font-size="13" fill="#64748b">Members</text>
  <text x="20" y="212" font-size="13" fill="#64748b">Permissions</text>
  <text x="20" y="234" font-size="10" fill="#475569" font-weight="700" letter-spacing="0.5">CHAT</text>
  <rect x="0" y="244" width="220" height="28" fill="rgba(99,102,241,0.12)"/>
  <rect x="0" y="244" width="2" height="28" fill="#6366f1"/>
  <text x="20" y="262" font-size="13" fill="#818cf8">Chat roles</text>
  <text x="20" y="290" font-size="13" fill="#64748b">Playbooks</text>

  <!-- Main content -->
  <text x="248" y="80" font-size="14" font-weight="700" fill="#e2e8f0">SDLC Role Catalog</text>
  <text x="248" y="96" font-size="11" fill="#64748b">Select 8–21 roles to enable for Role-Routed Chat on this project</text>
  <!-- count badge -->
  <rect x="660" y="66" width="110" height="26" rx="6" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1"/>
  <text x="672" y="84" font-size="11" fill="#818cf8">9 selected / 21</text>
  <rect x="780" y="66" width="80" height="26" rx="6" fill="#6366f1"/>
  <text x="800" y="84" font-size="12" fill="#fff">Save</text>

  <!-- LEADERSHIP section -->
  <text x="248" y="120" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">LEADERSHIP</text>
  <!-- Role row: CTO -->
  <rect x="248" y="128" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <!-- toggle on -->
  <rect x="524" y="142" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="148" r="8" fill="#fff"/>
  <text x="264" y="152" font-size="12" font-weight="600" fill="#e2e8f0">CTO</text>
  <rect x="264" y="138" width="0" height="0"/>
  <text x="340" y="152" font-size="10" fill="#64748b">Leadership · Executive</text>

  <!-- Role row: Chief Architect -->
  <rect x="248" y="174" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="524" y="188" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="194" r="8" fill="#fff"/>
  <text x="264" y="198" font-size="12" font-weight="600" fill="#e2e8f0">Chief Architect</text>
  <text x="380" y="198" font-size="10" fill="#64748b">Leadership · Arch</text>

  <!-- Role row: Project Manager -->
  <rect x="248" y="220" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="524" y="234" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="240" r="8" fill="#fff"/>
  <text x="264" y="244" font-size="12" font-weight="600" fill="#e2e8f0">Project Manager</text>
  <text x="380" y="244" font-size="10" fill="#64748b">Leadership · PM</text>

  <!-- ARCHITECTURE section -->
  <text x="248" y="282" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ARCHITECTURE</text>
  <rect x="248" y="290" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="524" y="304" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="310" r="8" fill="#fff"/>
  <text x="264" y="314" font-size="12" font-weight="600" fill="#e2e8f0">Solution Architect</text>
  <text x="380" y="314" font-size="10" fill="#64748b">Architecture</text>

  <!-- ENGINEERING section -->
  <text x="248" y="352" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ENGINEERING</text>
  <rect x="248" y="360" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="524" y="374" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="380" r="8" fill="#fff"/>
  <text x="264" y="384" font-size="12" font-weight="600" fill="#e2e8f0">FE Tech Lead</text>
  <text x="380" y="384" font-size="10" fill="#64748b">Engineering · Frontend</text>

  <rect x="248" y="406" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="524" y="420" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="550" cy="426" r="8" fill="#fff"/>
  <text x="264" y="430" font-size="12" font-weight="600" fill="#e2e8f0">BE Tech Lead</text>
  <text x="380" y="430" font-size="10" fill="#64748b">Engineering · Backend</text>

  <!-- Right column - more roles -->
  <text x="608" y="120" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ENGINEERING (cont.)</text>
  <rect x="608" y="128" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="884" y="142" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="910" cy="148" r="8" fill="#fff"/>
  <text x="624" y="152" font-size="12" font-weight="600" fill="#e2e8f0">Full-Stack EM</text>
  <text x="730" y="152" font-size="10" fill="#64748b">Engineering</text>

  <!-- Mobile EM - disabled -->
  <rect x="608" y="174" width="320" height="40" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <rect x="884" y="188" width="32" height="12" rx="6" fill="#2d3a5c"/>
  <circle cx="894" cy="194" r="8" fill="#475569"/>
  <text x="624" y="198" font-size="12" fill="#64748b">Mobile EM</text>
  <text x="730" y="198" font-size="10" fill="#475569">Mobile (optional)</text>

  <rect x="608" y="220" width="320" height="40" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <rect x="884" y="234" width="32" height="12" rx="6" fill="#2d3a5c"/>
  <circle cx="894" cy="240" r="8" fill="#475569"/>
  <text x="624" y="244" font-size="12" fill="#64748b">Mobile Tech Lead</text>
  <text x="750" y="244" font-size="10" fill="#475569">Mobile</text>

  <text x="608" y="282" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">QUALITY &amp; SECURITY</text>
  <rect x="608" y="290" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="884" y="304" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="910" cy="310" r="8" fill="#fff"/>
  <text x="624" y="314" font-size="12" font-weight="600" fill="#e2e8f0">QA Lead</text>
  <text x="730" y="314" font-size="10" fill="#64748b">Quality</text>

  <rect x="608" y="336" width="320" height="40" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1"/>
  <rect x="884" y="350" width="32" height="12" rx="6" fill="#6366f1"/>
  <circle cx="910" cy="356" r="8" fill="#fff"/>
  <text x="624" y="360" font-size="12" font-weight="600" fill="#e2e8f0">AppSec</text>
  <text x="730" y="360" font-size="10" fill="#64748b">Security</text>

  <!-- Min/max warning -->
  <rect x="248" y="490" width="680" height="40" rx="6" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="264" y="510" font-size="11" fill="#818cf8">ℹ  Minimum 8 roles required for playbook routing to function correctly. Maximum 21 roles.</text>
  <text x="264" y="524" font-size="10" fill="#64748b">Roles not selected will be marked as  "not in roster"  and skipped by the playbook engine.</text>
</svg>
