<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <rect x="0" y="0" width="220" height="750" fill="#1e2130"/>
  <text x="28" y="36" font-size="14" font-weight="700" fill="#ffffff">CGen PM</text>
  <rect x="16" y="480" width="188" height="36" rx="8" fill="#4f46e5" opacity="0.2"/>
  <text x="36" y="504" font-size="13" font-weight="600" fill="#818cf8">⚙  Settings</text>
  <text x="36" y="120" font-size="11" fill="#64748b">Workspace Profile</text>
  <text x="36" y="148" font-size="11" fill="#64748b">Members</text>
  <text x="36" y="176" font-size="11" fill="#64748b">Roles &amp; Permissions</text>
  <text x="36" y="204" font-size="11" fill="#64748b">Project Settings</text>
  <text x="36" y="232" font-size="11" fill="#64748b">Custom Fields</text>
  <text x="36" y="260" font-size="11" fill="#64748b">Notifications</text>
  <text x="36" y="288" font-size="11" font-weight="600" fill="#ffffff">Integrations</text>
  <rect x="16" y="276" width="188" height="28" rx="6" fill="#374151"/>
  <!-- Main area -->
  <rect x="220" y="0" width="980" height="56" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="248" y="34" font-size="14" font-weight="600" fill="#111827">Settings  →  Integrations</text>
  <text x="240" y="88" font-size="18" font-weight="700" fill="#111827">Integrations</text>
  <text x="240" y="108" font-size="13" fill="#9ca3af">Connect external tools and services to your workspace.</text>
  <!-- Connected section -->
  <text x="240" y="136" font-size="12" font-weight="700" fill="#15803d">Connected (2)</text>
  <!-- Slack card -->
  <rect x="240" y="144" width="450" height="96" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="256" y="162" width="44" height="44" rx="8" fill="#4A154B"/>
  <text x="278" y="191" text-anchor="middle" font-size="22" fill="#ffffff">#</text>
  <text x="314" y="175" font-size="14" font-weight="700" fill="#111827">Slack</text>
  <text x="314" y="193" font-size="12" fill="#6b7280">Connected to workspace: <tspan fill="#111827">acme-engineering</tspan></text>
  <text x="314" y="211" font-size="11" fill="#9ca3af">Notifications · Ticket updates · Daily standups</text>
  <rect x="580" y="160" width="80" height="28" rx="6" fill="#d1fae5"/>
  <text x="620" y="179" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Connected</text>
  <text x="660" y="230" text-anchor="end" font-size="12" fill="#ef4444">Disconnect</text>
  <!-- GitHub card -->
  <rect x="240" y="252" width="450" height="96" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="256" y="270" width="44" height="44" rx="8" fill="#24292f"/>
  <text x="278" y="299" text-anchor="middle" font-size="20" fill="#ffffff">⌥</text>
  <text x="314" y="283" font-size="14" font-weight="700" fill="#111827">GitHub</text>
  <text x="314" y="301" font-size="12" fill="#6b7280">Organization: <tspan fill="#111827">acme-corp</tspan>  ·  12 repos synced</text>
  <text x="314" y="319" font-size="11" fill="#9ca3af">PR linking · Issue sync · Deployment events</text>
  <rect x="580" y="268" width="80" height="28" rx="6" fill="#d1fae5"/>
  <text x="620" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Connected</text>
  <text x="660" y="338" text-anchor="end" font-size="12" fill="#ef4444">Disconnect</text>
  <!-- Available section -->
  <text x="240" y="370" font-size="12" font-weight="700" fill="#374151">Available</text>
  <!-- Jira card -->
  <rect x="240" y="378" width="290" height="100" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="256" y="396" width="40" height="40" rx="8" fill="#0052CC"/>
  <text x="276" y="422" text-anchor="middle" font-size="16" fill="#ffffff">J</text>
  <text x="308" y="408" font-size="13" font-weight="700" fill="#111827">Jira</text>
  <text x="308" y="424" font-size="11" fill="#6b7280">Import issues, sync sprint data</text>
  <text x="308" y="440" font-size="11" fill="#6b7280">from Jira projects</text>
  <rect x="258" y="460" width="100" height="28" rx="6" fill="#4f46e5"/>
  <text x="308" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
  <!-- Linear card -->
  <rect x="546" y="378" width="290" height="100" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="562" y="396" width="40" height="40" rx="8" fill="#5E6AD2"/>
  <text x="582" y="422" text-anchor="middle" font-size="16" fill="#ffffff">L</text>
  <text x="614" y="408" font-size="13" font-weight="700" fill="#111827">Linear</text>
  <text x="614" y="424" font-size="11" fill="#6b7280">Two-way sync with Linear issues</text>
  <text x="614" y="440" font-size="11" fill="#6b7280">and cycles</text>
  <rect x="564" y="460" width="100" height="28" rx="6" fill="#4f46e5"/>
  <text x="614" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
  <!-- Notion card -->
  <rect x="852" y="378" width="308" height="100" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="868" y="396" width="40" height="40" rx="8" fill="#000000"/>
  <text x="888" y="422" text-anchor="middle" font-size="16" fill="#ffffff">N</text>
  <text x="920" y="408" font-size="13" font-weight="700" fill="#111827">Notion</text>
  <text x="920" y="424" font-size="11" fill="#6b7280">Link docs and wikis to tasks</text>
  <text x="920" y="440" font-size="11" fill="#6b7280">and epics</text>
  <rect x="870" y="460" width="100" height="28" rx="6" fill="#4f46e5"/>
  <text x="920" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
  <!-- Figma card -->
  <rect x="240" y="492" width="290" height="100" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="256" y="510" width="40" height="40" rx="8" fill="#1E1E1E"/>
  <text x="276" y="536" text-anchor="middle" font-size="16" fill="#ff7262">F</text>
  <text x="308" y="522" font-size="13" font-weight="700" fill="#111827">Figma</text>
  <text x="308" y="538" font-size="11" fill="#6b7280">Attach Figma designs to tasks</text>
  <text x="308" y="554" font-size="11" fill="#6b7280">with live preview</text>
  <rect x="258" y="574" width="100" height="28" rx="6" fill="#4f46e5"/>
  <text x="308" y="593" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
  <!-- Sentry card -->
  <rect x="546" y="492" width="290" height="100" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="562" y="510" width="40" height="40" rx="8" fill="#362D59"/>
  <text x="582" y="536" text-anchor="middle" font-size="16" fill="#ffffff">S</text>
  <text x="614" y="522" font-size="13" font-weight="700" fill="#111827">Sentry</text>
  <text x="614" y="538" font-size="11" fill="#6b7280">Auto-create tasks from Sentry</text>
  <text x="614" y="554" font-size="11" fill="#6b7280">errors and alerts</text>
  <rect x="564" y="574" width="100" height="28" rx="6" fill="#4f46e5"/>
  <text x="614" y="593" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Connect</text>
  <!-- Webhook card -->
  <rect x="852" y="492" width="308" height="100" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="4 3"/>
  <rect x="868" y="510" width="40" height="40" rx="8" fill="#6b7280" opacity="0.15"/>
  <text x="888" y="536" text-anchor="middle" font-size="16" fill="#6b7280">⚡</text>
  <text x="920" y="522" font-size="13" font-weight="700" fill="#374151">Custom Webhook</text>
  <text x="920" y="538" font-size="11" fill="#6b7280">POST events to your own</text>
  <text x="920" y="554" font-size="11" fill="#6b7280">endpoint</text>
  <rect x="870" y="574" width="100" height="28" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="920" y="593" text-anchor="middle" font-size="12" fill="#374151">Configure</text>
  <!-- Webhook info callout -->
  <rect x="240" y="610" width="920" height="56" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="260" y="632" font-size="12" font-weight="700" fill="#92400e">ℹ  Building an integration?</text>
  <text x="260" y="652" font-size="12" fill="#92400e">Use the Webhook to receive real-time events, or explore our REST API → <tspan fill="#4f46e5" font-weight="600">API Docs</tspan> for custom integrations.</text>
</svg>
