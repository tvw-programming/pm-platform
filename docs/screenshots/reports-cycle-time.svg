  <text x="298" y="252" text-anchor="end" font-size="11" fill="#9ca3af">10d</text>
  <line x1="305" y1="248" x2="310" y2="248" stroke="#e5e7eb"/>
  <text x="298" y="312" text-anchor="end" font-size="11" fill="#9ca3af">7d</text>
  <line x1="305" y1="308" x2="310" y2="308" stroke="#e5e7eb"/>
