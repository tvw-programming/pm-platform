  <line x1="310" y1="188" x2="1140" y2="188" stroke="#f3f4f6"/>
  <line x1="310" y1="248" x2="1140" y2="248" stroke="#f3f4f6"/>
  <line x1="310" y1="308" x2="1140" y2="308" stroke="#f3f4f6"/>
  <line x1="310" y1="368" x2="1140" y2="368" stroke="#f3f4f6"/>
