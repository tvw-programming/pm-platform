  <rect x="938" y="428" width="22" height="112" rx="3" fill="#6b7280" opacity="0.6"/>
  <rect x="964" y="398" width="22" height="142" rx="3" fill="#7c3aed" opacity="0.7"/>
  <!-- Sprint 6 (current) -->
  <text x="1070" y="560" text-anchor="middle" font-size="11" fill="#9ca3af">Spr 6</text>
  <rect x="1024" y="278" width="22" height="262" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="1050" y="308" width="22" height="232" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="1076" y="428" width="22" height="112" rx="3" fill="#6b7280" opacity="0.6"/>
  <rect x="1102" y="368" width="22" height="172" rx="3" fill="#7c3aed" opacity="0.7"/>
  <!-- Legend -->
  <rect x="264" y="188" width="16" height="12" rx="2" fill="#3b82f6"/>
  <text x="286" y="199" font-size="11" fill="#374151">Feature</text>
  <rect x="344" y="188" width="16" height="12" rx="2" fill="#ef4444"/>
  <text x="366" y="199" font-size="11" fill="#374151">Bug</text>
  <rect x="406" y="188" width="16" height="12" rx="2" fill="#6b7280"/>
  <text x="428" y="199" font-size="11" fill="#374151">Chore</text>
  <rect x="480" y="188" width="16" height="12" rx="2" fill="#7c3aed"/>
  <text x="502" y="199" font-size="11" fill="#374151">Spike</text>
  <!-- Annotation callout -->
  <rect x="700" y="188" width="300" height="56" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="716" y="208" font-size="12" font-weight="700" fill="#92400e">⚠ Bug cycle time increasing</text>
  <text x="716" y="224" font-size="11" fill="#92400e">Bugs taking 5–8d avg. Target is ≤3d.</text>
  <text x="716" y="240" font-size="11" fill="#92400e">Consider dedicated bug rotation.</text>
  <!-- Insight box below chart -->
  <rect x="264" y="592" width="916" height="84" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="284" y="614" font-size="12" font-weight="700" fill="#15803d">💡 How to read this chart</text>
  <text x="284" y="632" font-size="12" fill="#374151">Lower = faster delivery. Compare <tspan font-weight="600">Bugs</tspan> to <tspan font-weight="600">Features</tspan> — if Bug bars grow taller over time, your bug</text>
  <text x="284" y="650" font-size="12" fill="#374151">resolution process is slowing down. <tspan font-weight="600">Spikes</tspan> naturally take longer; outliers should be reviewed for</text>
  <text x="284" y="668" font-size="12" fill="#374151">scope creep. Filter by project or team in the dropdowns above.</text>
