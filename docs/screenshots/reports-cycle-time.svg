  <line x1="305" y1="428" x2="310" y2="428" stroke="#e5e7eb"/>
  <text x="298" y="492" text-anchor="end" font-size="11" fill="#9ca3af">1d</text>
  <line x1="305" y1="488" x2="310" y2="488" stroke="#e5e7eb"/>
  <line x1="310" y1="540" x2="1140" y2="540" stroke="#e5e7eb" stroke-width="1.5"/>
