  <text x="264" y="166" font-size="12" fill="#9ca3af">Average days from task creation to Done · Last 6 sprints</text>
  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="310" y1="188" x2="310" y2="540" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="298" y="192" text-anchor="end" font-size="11" fill="#9ca3af">14d</text>
