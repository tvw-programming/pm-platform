  <!-- Y axis label -->
  <text x="264" y="370" font-size="11" fill="#9ca3af" transform="rotate(-90 264 370)" text-anchor="middle">Avg Days</text>
  <!-- Bars — Feature (blue), Bug (red), Chore (grey), Spike (purple) -->
  <!-- Sprint 1 group -->
  <text x="380" y="560" text-anchor="middle" font-size="11" fill="#9ca3af">Spr 1</text>
  <rect x="334" y="308" width="22" height="232" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="360" y="368" width="22" height="172" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="386" y="428" width="22" height="112" rx="3" fill="#6b7280" opacity="0.6"/>
  <!-- Sprint 2 group -->
  <text x="518" y="560" text-anchor="middle" font-size="11" fill="#9ca3af">Spr 2</text>
  <rect x="472" y="278" width="22" height="262" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="498" y="338" width="22" height="202" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="524" y="428" width="22" height="112" rx="3" fill="#6b7280" opacity="0.6"/>
  <!-- Sprint 3 group -->
  <text x="656" y="560" text-anchor="middle" font-size="11" fill="#9ca3af">Spr 3</text>
  <rect x="610" y="248" width="22" height="292" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="636" y="308" width="22" height="232" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="662" y="428" width="22" height="112" rx="3" fill="#6b7280" opacity="0.6"/>
  <!-- Sprint 4 group -->
  <text x="794" y="560" text-anchor="middle" font-size="11" fill="#9ca3af">Spr 4</text>
  <rect x="748" y="278" width="22" height="262" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="774" y="368" width="22" height="172" rx="3" fill="#ef4444" opacity="0.8"/>
  <rect x="800" y="438" width="22" height="102" rx="3" fill="#6b7280" opacity="0.6"/>
  <rect x="826" y="408" width="22" height="132" rx="3" fill="#7c3aed" opacity="0.7"/>
