<svg width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="960" height="560" fill="#0f1117" opacity="0.7"/>
  <!-- overlay -->
  <rect width="960" height="560" fill="rgba(0,0,0,0.6)"/>
  <!-- modal -->
  <rect x="280" y="60" width="400" height="440" rx="10" fill="#161b2e" stroke="#2d3a5c" stroke-width="1"/>
  <!-- modal header -->
  <text x="300" y="92" font-size="16" font-weight="700" fill="#f1f5f9">New Task</text>
  <text x="660" y="92" font-size="18" fill="#64748b" text-anchor="end">✕</text>
  <line x1="280" y1="104" x2="680" y2="104" stroke="#1e2640" stroke-width="1"/>

  <!-- Title field -->
  <text x="300" y="128" font-size="11" font-weight="600" fill="#94a3b8">Title *</text>
  <rect x="300" y="136" width="360" height="36" rx="6" fill="#1a2035" stroke="#6366f1" stroke-width="1.5"/>
  <text x="316" y="159" font-size="12" fill="#e2e8f0">Implement token refresh for OAuth sessions</text>

  <!-- Type -->
  <text x="300" y="198" font-size="11" font-weight="600" fill="#94a3b8">Type</text>
  <rect x="300" y="206" width="80" height="28" rx="5" fill="#6366f1"/>
  <text x="318" y="225" font-size="12" fill="#fff">● Feature</text>
  <rect x="388" y="206" width="64" height="28" rx="5" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="404" y="225" font-size="12" fill="#64748b">○ Bug</text>
  <rect x="460" y="206" width="66" height="28" rx="5" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="472" y="225" font-size="12" fill="#64748b">○ Chore</text>
  <rect x="534" y="206" width="62" height="28" rx="5" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="546" y="225" font-size="12" fill="#64748b">○ Spike</text>

  <!-- Priority -->
  <text x="300" y="260" font-size="11" font-weight="600" fill="#94a3b8">Priority</text>
  <rect x="300" y="268" width="68" height="28" rx="5" fill="rgba(248,113,113,0.2)" stroke="#f87171" stroke-width="1"/>
  <text x="314" y="287" font-size="12" fill="#f87171">● High</text>
  <rect x="376" y="268" width="74" height="28" rx="5" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="386" y="287" font-size="12" fill="#64748b">○ Medium</text>
  <rect x="458" y="268" width="60" height="28" rx="5" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="470" y="287" font-size="12" fill="#64748b">○ Low</text>

  <!-- Sprint + Assignee row -->
  <text x="300" y="322" font-size="11" font-weight="600" fill="#94a3b8">Sprint</text>
  <rect x="300" y="330" width="168" height="32" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="316" y="351" font-size="12" fill="#94a3b8">Sprint 12 ▾</text>

  <text x="490" y="322" font-size="11" font-weight="600" fill="#94a3b8">Assignee</text>
  <rect x="490" y="330" width="170" height="32" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="506" y="351" font-size="12" fill="#94a3b8">Arun Kumar ▾</text>

  <!-- Points + Labels row -->
  <text x="300" y="386" font-size="11" font-weight="600" fill="#94a3b8">Story Points</text>
  <rect x="300" y="394" width="80" height="32" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="316" y="415" font-size="12" fill="#94a3b8">5 ▾</text>

  <text x="400" y="386" font-size="11" font-weight="600" fill="#94a3b8">Labels</text>
  <rect x="400" y="394" width="40" height="24" rx="12" fill="rgba(99,102,241,0.15)"/>
  <text x="412" y="411" font-size="10" fill="#818cf8">auth</text>
  <rect x="448" y="394" width="36" height="24" rx="12" fill="rgba(99,102,241,0.15)"/>
  <text x="458" y="411" font-size="10" fill="#818cf8">api</text>
  <rect x="492" y="394" width="50" height="24" rx="12" fill="none" stroke="#2d3a5c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="504" y="411" font-size="10" fill="#475569">+ add</text>

  <!-- Action buttons -->
  <rect x="456" y="452" width="84" height="36" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="484" y="475" font-size="13" fill="#64748b">Cancel</text>
  <rect x="550" y="452" width="110" height="36" rx="6" fill="#6366f1"/>
  <text x="566" y="475" font-size="13" fill="#fff">Create task</text>
</svg>
