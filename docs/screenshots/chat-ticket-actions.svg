<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <rect x="0" y="0" width="220" height="750" fill="#1e2130"/>
  <text x="28" y="36" font-size="14" font-weight="700" fill="#ffffff">CGen PM</text>
  <rect x="16" y="100" width="188" height="36" rx="8" fill="#4f46e5" opacity="0.2"/>
  <text x="36" y="124" font-size="13" font-weight="600" fill="#818cf8">💬  Chat</text>
  <!-- Main panel -->
  <rect x="220" y="0" width="980" height="56" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="248" y="34" font-size="14" font-weight="600" fill="#111827">Chat — Ticket Actions</text>
  <!-- Title -->
  <text x="248" y="90" font-size="18" font-weight="700" fill="#111827">Ticket Action Types</text>
  <text x="248" y="110" font-size="13" fill="#6b7280">Each ticket kind has specific available actions. Actions are shown inline below each work event message.</text>
  <!-- Ticket card 1: approve_reject -->
  <rect x="240" y="130" width="460" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="240" y="130" width="460" height="44" rx="10" fill="#fee2e2"/>
  <rect x="240" y="160" width="460" height="14" fill="#fee2e2"/>
  <text x="260" y="156" font-size="12" font-weight="700" fill="#dc2626">approve_reject</text>
  <rect x="590" y="140" width="88" height="22" rx="11" fill="#fecaca"/>
  <text x="634" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Must Respond</text>
  <text x="260" y="192" font-size="12" fill="#6b7280">Ticket requires a formal decision: approve or reject.</text>
  <text x="260" y="208" font-size="12" fill="#6b7280">Optional rejection reason is captured on Reject.</text>
  <!-- Action buttons -->
  <rect x="260" y="222" width="100" height="36" rx="8" fill="#059669"/>
  <text x="310" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">✓ Approve</text>
  <rect x="370" y="222" width="100" height="36" rx="8" fill="#ef4444"/>
  <text x="420" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">✗ Reject</text>
  <text x="260" y="296" font-size="11" fill="#9ca3af">Used by: P01, P03, P04, P08, P09…</text>
  <!-- Ticket card 2: review -->
  <rect x="720" y="130" width="460" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="720" y="130" width="460" height="44" rx="10" fill="#fef3c7"/>
  <rect x="720" y="160" width="460" height="14" fill="#fef3c7"/>
  <text x="740" y="156" font-size="12" font-weight="700" fill="#d97706">review</text>
  <rect x="1060" y="140" width="88" height="22" rx="11" fill="#fde68a"/>
  <text x="1104" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Must Respond</text>
  <text x="740" y="192" font-size="12" fill="#6b7280">Reviewer must read and confirm they've reviewed</text>
  <text x="740" y="208" font-size="12" fill="#6b7280">the artifact, document, or PR.</text>
  <rect x="740" y="222" width="110" height="36" rx="8" fill="#3b82f6"/>
  <text x="795" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">✓ Mark Done</text>
  <text x="740" y="296" font-size="11" fill="#9ca3af">Used by: P05, P06, P07, P15, P16…</text>
  <!-- Ticket card 3: ack -->
  <rect x="240" y="330" width="460" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="240" y="330" width="460" height="44" rx="10" fill="#dbeafe"/>
  <rect x="240" y="360" width="460" height="14" fill="#dbeafe"/>
  <text x="260" y="356" font-size="12" font-weight="700" fill="#1d4ed8">ack</text>
  <rect x="570" y="340" width="108" height="22" rx="11" fill="#bfdbfe"/>
  <text x="624" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Must Respond</text>
  <text x="260" y="392" font-size="12" fill="#6b7280">Simple acknowledgement. Role must confirm they</text>
  <text x="260" y="408" font-size="12" fill="#6b7280">have seen and understood the message.</text>
  <rect x="260" y="422" width="120" height="36" rx="8" fill="#6366f1"/>
  <text x="320" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">👁 Acknowledge</text>
  <text x="260" y="492" font-size="11" fill="#9ca3af">Used by: P10, P12, P21, P22…</text>
  <!-- Ticket card 4: action_done -->
  <rect x="720" y="330" width="460" height="180" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="720" y="330" width="460" height="44" rx="10" fill="#d1fae5"/>
  <rect x="720" y="360" width="460" height="14" fill="#d1fae5"/>
  <text x="740" y="356" font-size="12" font-weight="700" fill="#065f46">action_done</text>
  <rect x="1040" y="340" width="108" height="22" rx="11" fill="#a7f3d0"/>
  <text x="1094" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Must Respond</text>
  <text x="740" y="392" font-size="12" fill="#6b7280">Role must complete a real-world action and</text>
  <text x="740" y="408" font-size="12" fill="#6b7280">confirm the action was taken.</text>
  <rect x="740" y="422" width="136" height="36" rx="8" fill="#059669"/>
  <text x="808" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">✓ Mark Action Done</text>
  <text x="740" y="492" font-size="11" fill="#9ca3af">Used by: P11, P13, P14, P18, P19…</text>
  <!-- Expiry / SLA section -->
  <rect x="240" y="530" width="940" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="264" y="556" font-size="13" font-weight="700" fill="#991b1b">⏰ SLA &amp; Ticket Expiry</text>
  <text x="264" y="576" font-size="12" fill="#374151">Every ticket has an SLA countdown. When the timer reaches zero, the ticket is marked <tspan font-weight="600">escalated</tspan> and</text>
  <text x="264" y="594" font-size="12" fill="#374151">the playbook PM receives an alert. Expired tickets can still be actioned — the SLA is a warning, not a lock.</text>
  <!-- Resolved state example -->
  <rect x="240" y="626" width="940" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="264" y="652" font-size="13" font-weight="700" fill="#15803d">✅ Resolved Ticket</text>
  <text x="264" y="672" font-size="12" fill="#374151">Once all required tickets for a playbook instance are resolved, the playbook is marked <tspan font-weight="600">complete</tspan> and</text>
  <text x="264" y="690" font-size="12" fill="#374151">a completion summary appears in the message thread. Resolved tickets cannot be undone.</text>
</svg>
