  <rect x="40" y="492" width="40" height="22" rx="11" fill="#1e2640" x="112"/>
  <rect x="112" y="492" width="44" height="22" rx="11" fill="#1e2640"/>
  <text x="120" y="507" font-size="10" fill="#64748b">auth</text>
  <rect x="162" y="492" width="36" height="22" rx="11" fill="#1e2640"/>
  <text x="170" y="507" font-size="10" fill="#64748b">api</text>
  <rect x="204" y="492" width="60" height="22" rx="11" fill="#1e2640"/>
