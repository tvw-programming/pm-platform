  <rect x="656" y="212" width="288" height="72" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
  <text x="670" y="232" font-size="10" font-weight="700" fill="#818cf8">🎫  T-002  ·  P01 New Feature</text>
  <text x="670" y="248" font-size="11" fill="#e2e8f0">Architecture sign-off</text>
  <text x="670" y="262" font-size="10" fill="#64748b">Chief Architect  ·  ⏰ 46h remaining</text>
  <rect x="670" y="270" width="72" height="22" rx="5" fill="#10b981"/>
  <text x="680" y="285" font-size="10" fill="#fff">Approve ✓</text>
  <rect x="752" y="270" width="60" height="22" rx="5" fill="rgba(248,113,113,0.2)" stroke="#f87171" stroke-width="1"/>
  <text x="762" y="285" font-size="10" fill="#f87171">Reject ✗</text>

  <!-- Ticket 3 - expiring soon -->
  <rect x="656" y="294" width="288" height="72" rx="6" fill="#1a2035" stroke="#fbbf24" stroke-width="1"/>
  <text x="670" y="314" font-size="10" font-weight="700" fill="#fbbf24">🎫  T-003  ·  P05 Code Review</text>
  <text x="670" y="330" font-size="11" fill="#e2e8f0">Code review complete</text>
