  <circle cx="44" cy="318" r="16" fill="#10b981"/>
  <text x="38" y="322" font-size="10" fill="#fff">CTO</text>
  <text x="68" y="310" font-size="12" font-weight="600" fill="#e2e8f0">Tejas Waghulde  <tspan font-size="10" fill="#475569">  CTO</tspan></text>
  <text x="68" y="328" font-size="12" fill="#94a3b8">"Approved — proceed with implementation"</text>
  <rect x="68" y="336" width="82" height="16" rx="4" fill="rgba(16,185,129,0.12)"/>
  <text x="76" y="348" font-size="9" fill="#10b981">✓ Mandatory</text>
  <text x="580" y="310" font-size="10" fill="#475569">10:16</text>

