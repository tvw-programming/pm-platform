  <text x="221" y="159" font-size="9" fill="#475569" text-anchor="middle">🔔  work_event  ·  P01 New Feature</text>
  <text x="310" y="159" font-size="9" fill="#6366f1">Playbook fired</text>

  <!-- Playbook routing summary -->
  <rect x="64" y="166" width="520" height="64" rx="6" fill="#1a2035" stroke="#2d3a5c" stroke-width="1"/>
