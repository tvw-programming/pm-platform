  <text x="68" y="112" font-size="12" font-weight="600" fill="#e2e8f0">Tejas Waghulde</text>
  <text x="68" y="130" font-size="12" fill="#94a3b8">Starting work on the auth layer today</text>
  <text x="580" y="112" font-size="10" fill="#475569">10:14</text>

  <!-- Divider -->
  <line x1="24" y1="154" x2="616" y2="154" stroke="#1e2640" stroke-width="1"/>
