  <text x="68" y="252" font-size="12" font-weight="600" fill="#e2e8f0">Arun Kumar  <tspan font-size="10" fill="#475569">  Project Manager</tspan></text>
  <text x="68" y="270" font-size="12" fill="#94a3b8">"Looks good, assigning to Sprint 13"</text>
  <rect x="68" y="278" width="82" height="16" rx="4" fill="rgba(16,185,129,0.12)"/>
  <text x="76" y="290" font-size="9" fill="#10b981">✓ Mandatory</text>
  <text x="580" y="252" font-size="10" fill="#475569">10:15</text>

