<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <rect x="0" y="0" width="220" height="750" fill="#1e2130"/>
  <text x="28" y="36" font-size="14" font-weight="700" fill="#ffffff">CGen PM</text>
  <text x="36" y="90" font-size="13" fill="#64748b">📋  Tasks</text>
  <rect x="16" y="100" width="188" height="36" rx="8" fill="#4f46e5" opacity="0.2"/>
  <text x="36" y="124" font-size="13" font-weight="600" fill="#818cf8">🏃  Sprints</text>
  <text x="36" y="162" font-size="13" fill="#64748b">🗺  Roadmap</text>
  <!-- Main area -->
  <rect x="220" y="0" width="980" height="56" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="248" y="22" font-size="12" fill="#9ca3af">Plan /</text>
  <text x="292" y="22" font-size="12" font-weight="600" fill="#111827">Sprints / Q2 Sprint 4</text>
  <!-- Chart card -->
  <rect x="240" y="72" width="940" height="620" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="264" y="104" font-size="15" font-weight="700" fill="#111827">Sprint Burn-down</text>
  <text x="264" y="122" font-size="12" fill="#9ca3af">Q2 Sprint 4 · Jun 10–24, 2025 · 60 story points</text>
  <!-- Legend -->
  <line x1="820" y1="100" x2="848" y2="100" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="856" y="104" font-size="12" fill="#6b7280">Ideal</text>
  <line x1="900" y1="100" x2="928" y2="100" stroke="#4f46e5" stroke-width="2.5"/>
  <circle cx="914" cy="100" r="4" fill="#4f46e5"/>
  <text x="936" y="104" font-size="12" fill="#6b7280">Actual</text>
  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="310" y1="144" x2="310" y2="584" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Y ticks + labels -->
  <text x="290" y="152" text-anchor="end" font-size="11" fill="#9ca3af">60</text>
  <line x1="305" y1="148" x2="310" y2="148" stroke="#e5e7eb"/>
  <text x="290" y="240" text-anchor="end" font-size="11" fill="#9ca3af">45</text>
  <line x1="305" y1="236" x2="310" y2="236" stroke="#e5e7eb"/>
  <text x="290" y="328" text-anchor="end" font-size="11" fill="#9ca3af">30</text>
  <line x1="305" y1="324" x2="310" y2="324" stroke="#e5e7eb"/>
  <text x="290" y="416" text-anchor="end" font-size="11" fill="#9ca3af">15</text>
  <line x1="305" y1="412" x2="310" y2="412" stroke="#e5e7eb"/>
  <text x="290" y="504" text-anchor="end" font-size="11" fill="#9ca3af">0</text>
  <!-- Y grid lines -->
  <line x1="310" y1="148" x2="1100" y2="148" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="310" y1="236" x2="1100" y2="236" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="310" y1="324" x2="1100" y2="324" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="310" y1="412" x2="1100" y2="412" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="310" y1="500" x2="1100" y2="500" stroke="#f3f4f6" stroke-width="1"/>
  <!-- X axis -->
  <line x1="310" y1="500" x2="1100" y2="500" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- X labels (days) -->
  <text x="310" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 10</text>
  <text x="388" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 11</text>
  <text x="466" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 12</text>
  <text x="544" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 13</text>
  <text x="622" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 16</text>
  <text x="700" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 17</text>
  <text x="778" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 18</text>
  <text x="856" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 19</text>
  <text x="934" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 20</text>
  <text x="1012" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 23</text>
  <text x="1090" y="520" text-anchor="middle" font-size="11" fill="#9ca3af">Jun 24</text>
  <!-- IDEAL line (dashed, diagonal) 60→0 -->
  <line x1="310" y1="148" x2="1100" y2="500" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- ACTUAL line (actual burn - starts slow, catches up) -->
  <!-- Points: D1=60, D2=58, D3=55, D4=50, D5=48, D6=40, D7=35, D8=30, D9=22, D10=12, D11=5 -->
  <!-- Y mapping: 60pts→148, 0→500. Range=352, per pt=5.87 -->
  <!-- x: 310,388,466,544,622,700,778,856,934,1012,1090 -->
  <polyline points="310,148 388,160 466,177 544,206 622,218 700,265 778,294 856,324 934,371 1012,430 1090,471" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dots on actual line -->
  <circle cx="310" cy="148" r="5" fill="#4f46e5"/>
  <circle cx="388" cy="160" r="5" fill="#4f46e5"/>
  <circle cx="466" cy="177" r="5" fill="#4f46e5"/>
  <circle cx="544" cy="206" r="5" fill="#4f46e5"/>
  <circle cx="622" cy="218" r="5" fill="#4f46e5"/>
  <circle cx="700" cy="265" r="5" fill="#4f46e5"/>
  <circle cx="778" cy="294" r="5" fill="#4f46e5"/>
  <circle cx="856" cy="324" r="5" fill="#4f46e5"/>
  <circle cx="934" cy="371" r="5" fill="#4f46e5"/>
  <!-- Today marker -->
  <line x1="934" y1="144" x2="934" y2="500" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="914" y="132" width="42" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="935" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">TODAY</text>
  <!-- Annotation: BELOW ideal = ahead -->
  <rect x="580" y="368" width="210" height="52" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="590" y="387" font-size="12" font-weight="700" fill="#065f46">✓ Ahead of schedule</text>
  <text x="590" y="404" font-size="11" fill="#065f46">Actual line is BELOW the</text>
  <text x="590" y="418" font-size="11" fill="#065f46">ideal — team is burning fast</text>
  <!-- Arrow to gap -->
  <path d="M 685,370 L 720,310" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#059669"/></marker></defs>
  <!-- Annotation: hypothetical ABOVE = at risk -->
  <rect x="370" y="540" width="560" height="52" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="390" y="559" font-size="12" font-weight="700" fill="#991b1b">⚠ If actual line is ABOVE ideal → team is behind and at risk</text>
  <text x="390" y="577" font-size="11" fill="#991b1b">Sprint goal may not be completed. Consider scope reduction.</text>
  <!-- Y axis label -->
  <text x="264" y="340" font-size="11" fill="#9ca3af" transform="rotate(-90 264 340)" text-anchor="middle">Story Points Remaining</text>
</svg>
