  <line x1="1057" y1="240" x2="1057" y2="270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="990" y="288" font-size="11" fill="#ef4444" font-weight="600">Red border = needs attention</text>
  <!-- Delta badge legend -->
  <rect x="240" y="310" width="920" height="56" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="260" y="334" font-size="12" font-weight="700" fill="#92400e">Delta Badge Colors</text>
  <rect x="380" y="322" width="60" height="22" rx="11" fill="#d1fae5"/>
  <text x="410" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">▲ Green</text>
  <text x="452" y="338" font-size="11" fill="#92400e">= Good direction (more done, fewer blocked)</text>
  <rect x="700" y="322" width="52" height="22" rx="11" fill="#fee2e2"/>
  <text x="726" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">▼ Red</text>
  <text x="765" y="338" font-size="11" fill="#92400e">= Bad direction (more blocked, fewer done)</text>
  <rect x="1000" y="322" width="46" height="22" rx="11" fill="#f3f4f6"/>
  <text x="1023" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">= Grey</text>
  <text x="1058" y="338" font-size="11" fill="#92400e">= No change</text>
  <!-- My Work Panel -->
  <text x="240" y="400" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="0.06em">MY WORK TODAY</text>
  <rect x="240" y="414" width="920" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="252" y="430" width="8" height="20" rx="2" fill="#ef4444"/>
  <text x="272" y="445" font-size="13" font-weight="600" fill="#111827">Fix auth token refresh on mobile</text>
  <rect x="600" y="433" width="52" height="18" rx="9" fill="#fee2e2"/>
  <text x="626" y="446" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">High</text>
  <rect x="664" y="433" width="84" height="18" rx="9" fill="#e0e7ff"/>
  <text x="706" y="446" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">In Progress</text>
  <rect x="760" y="433" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="779" y="446" text-anchor="middle" font-size="10" fill="#9ca3af">Bug</text>
  <rect x="240" y="470" width="920" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="252" y="486" width="8" height="20" rx="2" fill="#f59e0b"/>
  <text x="272" y="501" font-size="13" font-weight="600" fill="#111827">Design review: Settings redesign</text>
  <rect x="600" y="489" width="58" height="18" rx="9" fill="#fef3c7"/>
  <text x="629" y="502" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">Medium</text>
  <rect x="670" y="489" width="50" height="18" rx="9" fill="#f3f4f6"/>
  <text x="695" y="502" text-anchor="middle" font-size="10" fill="#6b7280">Review</text>
</svg>
