<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="56" fill="#1e2130"/>
  <text x="28" y="22" font-size="11" font-weight="700" fill="#ffffff" opacity="0.5" letter-spacing="1">CGEN PM</text>
