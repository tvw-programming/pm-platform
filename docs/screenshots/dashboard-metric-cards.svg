  <text x="260" y="34" font-size="14" font-weight="600" fill="#111827">Good morning, Alex 👋</text>
  <rect x="920" y="14" width="120" height="28" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="980" y="33" text-anchor="middle" font-size="12" fill="#6b7280">Q2 Sprint 4  ▾</text>
  <circle cx="1140" cy="28" r="18" fill="#ddd6fe"/>
  <text x="1140" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">AJ</text>
  <!-- Section label -->
  <text x="240" y="90" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="0.06em">SPRINT HEALTH</text>
  <!-- Card 1 — Open Tasks -->
  <rect x="240" y="104" width="218" height="124" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="240" y="104" width="218" height="4" rx="2" fill="#6366f1"/>
  <text x="258" y="130" font-size="12" fill="#6b7280">Open Tasks</text>
  <text x="258" y="175" font-size="42" font-weight="800" fill="#111827" font-variant-numeric="tabular-nums">34</text>
  <rect x="348" y="154" width="90" height="24" rx="12" fill="#fef3c7"/>
  <text x="393" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">▲ 3 today</text>
  <text x="258" y="216" font-size="11" fill="#9ca3af">vs 31 yesterday</text>
  <!-- Card 2 — In Progress -->
  <rect x="474" y="104" width="218" height="124" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="474" y="104" width="218" height="4" rx="2" fill="#3b82f6"/>
