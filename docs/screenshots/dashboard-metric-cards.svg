  <text x="492" y="175" font-size="42" font-weight="800" fill="#111827">12</text>
  <rect x="554" y="154" width="116" height="24" rx="12" fill="#dbeafe"/>
  <text x="612" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">= same as yest.</text>
  <text x="492" y="216" font-size="11" fill="#9ca3af">6 of 12 have PRs</text>
  <!-- Card 3 — Completed -->
  <rect x="708" y="104" width="218" height="124" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="708" y="104" width="218" height="4" rx="2" fill="#10b981"/>
  <text x="726" y="130" font-size="12" fill="#6b7280">Completed</text>
  <text x="726" y="175" font-size="42" font-weight="800" fill="#111827">47</text>
  <rect x="788" y="154" width="114" height="24" rx="12" fill="#d1fae5"/>
  <text x="845" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">▲ 8 this week</text>
  <text x="726" y="216" font-size="11" fill="#9ca3af">Sprint goal: 60 pts</text>
  <!-- Card 4 — Blocked -->
  <rect x="942" y="104" width="218" height="124" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="942" y="104" width="218" height="4" rx="2" fill="#ef4444"/>
  <text x="960" y="130" font-size="12" fill="#6b7280">Blocked</text>
  <text x="960" y="175" font-size="42" font-weight="800" fill="#ef4444">5</text>
  <rect x="1002" y="154" width="130" height="24" rx="12" fill="#fee2e2"/>
  <text x="1067" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">▲ 2 need action</text>
  <text x="960" y="216" font-size="11" fill="#9ca3af">Oldest: 3 days</text>
