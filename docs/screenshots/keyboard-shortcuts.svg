<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#111827"/>
  <!-- Modal overlay -->
  <rect x="100" y="40" width="1000" height="670" rx="14" fill="#1f2937"/>
  <rect x="100" y="40" width="1000" height="60" rx="14" fill="#374151"/>
  <rect x="100" y="86" width="1000" height="14" fill="#374151"/>
  <text x="600" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#f9fafb">Keyboard Shortcuts</text>
  <text x="1080" y="76" text-anchor="end" font-size="18" fill="#9ca3af">×</text>
  <text x="130" y="76" font-size="12" fill="#9ca3af">Press <tspan fill="#d1d5db" font-weight="600">?</tspan> to toggle this panel</text>
  <!-- Column 1 — Navigation -->
  <text x="130" y="128" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.08em">NAVIGATION</text>
  <!-- shortcut rows col 1 -->
  <text x="130" y="154" font-size="13" fill="#d1d5db">Go to Dashboard</text>
  <rect x="310" y="140" width="48" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="334" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">G</text>
  <rect x="364" y="140" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="376" y="157" text-anchor="middle" font-size="12" fill="#9ca3af">+</text>
  <rect x="394" y="140" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="406" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">D</text>
  <text x="130" y="186" font-size="13" fill="#d1d5db">Go to Tasks</text>
  <rect x="310" y="172" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="322" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">G</text>
  <rect x="340" y="172" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="352" y="189" text-anchor="middle" font-size="11" fill="#9ca3af">+</text>
  <rect x="370" y="172" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="382" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">T</text>
  <text x="130" y="218" font-size="13" fill="#d1d5db">Go to Sprints</text>
  <rect x="310" y="204" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="322" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">G</text>
  <rect x="340" y="204" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="352" y="221" text-anchor="middle" font-size="11" fill="#9ca3af">+</text>
  <rect x="370" y="204" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="382" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">S</text>
  <text x="130" y="250" font-size="13" fill="#d1d5db">Go to Roadmap</text>
  <rect x="310" y="236" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="322" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">G</text>
  <rect x="340" y="236" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="352" y="253" text-anchor="middle" font-size="11" fill="#9ca3af">+</text>
  <rect x="370" y="236" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="382" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">R</text>
  <text x="130" y="282" font-size="13" fill="#d1d5db">Go to Chat</text>
  <rect x="310" y="268" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="322" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">G</text>
  <rect x="340" y="268" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="352" y="285" text-anchor="middle" font-size="11" fill="#9ca3af">+</text>
  <rect x="370" y="268" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="382" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">C</text>
  <!-- Column 1 — Tasks -->
