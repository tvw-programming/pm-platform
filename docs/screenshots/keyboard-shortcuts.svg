  <rect x="352" y="366" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="364" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">K</text>
  <text x="130" y="412" font-size="13" fill="#d1d5db">Toggle board / list view</text>
  <rect x="310" y="398" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="322" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">V</text>
