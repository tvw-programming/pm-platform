  <rect x="870" y="366" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="882" y="383" text-anchor="middle" font-size="11" fill="#f9fafb">↵</text>
  <text x="620" y="412" font-size="13" fill="#d1d5db">Toggle event mode</text>
  <rect x="820" y="398" width="36" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="838" y="415" text-anchor="middle" font-size="11" fill="#f9fafb">⌘</text>
  <rect x="862" y="398" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="874" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">E</text>
  <text x="620" y="444" font-size="13" fill="#d1d5db">Focus chat input</text>
  <rect x="820" y="430" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="832" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">/</text>
  <!-- Column 2 — Global -->
  <text x="620" y="490" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.08em">GLOBAL</text>
  <text x="620" y="516" font-size="13" fill="#d1d5db">Command palette</text>
  <rect x="820" y="502" width="36" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="838" y="519" text-anchor="middle" font-size="11" fill="#f9fafb">⌘</text>
  <rect x="862" y="502" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="874" y="519" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">K</text>
  <text x="620" y="548" font-size="13" fill="#d1d5db">Show keyboard shortcuts</text>
  <rect x="820" y="534" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="832" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">?</text>
  <text x="620" y="580" font-size="13" fill="#d1d5db">Quick switch project</text>
  <rect x="820" y="566" width="36" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="838" y="583" text-anchor="middle" font-size="11" fill="#f9fafb">⌘</text>
  <rect x="862" y="566" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="874" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">J</text>
  <!-- divider -->
  <line x1="120" y1="640" x2="1080" y2="640" stroke="#374151"/>
  <text x="600" y="666" text-anchor="middle" font-size="11" fill="#6b7280">On Windows/Linux use <tspan fill="#9ca3af" font-weight="600">Ctrl</tspan> in place of <tspan fill="#9ca3af" font-weight="600">⌘</tspan>  ·  Shortcuts work everywhere except inside text inputs</text>
</svg>
