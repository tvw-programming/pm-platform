  <rect x="352" y="334" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="364" y="351" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">N</text>
  <text x="130" y="380" font-size="13" fill="#d1d5db">Search / open task</text>
  <rect x="310" y="366" width="36" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
