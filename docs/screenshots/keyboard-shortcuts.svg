  <text x="130" y="476" font-size="13" fill="#d1d5db">Select all tasks</text>
  <rect x="310" y="462" width="36" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="328" y="479" text-anchor="middle" font-size="11" fill="#f9fafb">⌘</text>
  <rect x="352" y="462" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="364" y="479" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">A</text>
