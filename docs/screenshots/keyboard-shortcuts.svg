  <rect x="862" y="140" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="874" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">I</text>
  <text x="620" y="186" font-size="13" fill="#d1d5db">Set priority</text>
  <rect x="820" y="172" width="24" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="832" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#f9fafb">P</text>
