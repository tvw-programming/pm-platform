  <rect x="820" y="268" width="52" height="24" rx="5" fill="#374151" stroke="#4b5563"/>
  <text x="846" y="285" text-anchor="middle" font-size="11" fill="#f9fafb">Esc</text>
  <!-- Column 2 — Chat -->
  <text x="620" y="322" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.08em">CHAT</text>
