<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <rect width="1200" height="750" fill="#1e2130" opacity="0.5"/>
  <defs><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#0004"/></filter></defs>
  <rect x="330" y="80" width="540" height="590" rx="12" fill="#ffffff" filter="url(#sh)"/>
  <!-- Header -->
  <rect x="330" y="80" width="540" height="68" rx="12" fill="#7c3aed"/>
  <rect x="330" y="124" width="540" height="24" fill="#7c3aed"/>
  <text x="600" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">🏁 Close Sprint</text>
  <text x="600" y="128" text-anchor="middle" font-size="12" fill="#e9d5ff">Q2 Sprint 4 — Jun 10 to Jun 24</text>
  <!-- Stats summary -->
  <rect x="354" y="168" width="492" height="84" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="600" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Sprint completed!</text>
  <text x="440" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#111827">47</text>
  <text x="440" y="236" text-anchor="middle" font-size="11" fill="#6b7280">Done</text>
  <line x1="480" y1="208" x2="480" y2="240" stroke="#e5e7eb"/>
  <text x="530" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#f59e0b">5</text>
  <text x="530" y="236" text-anchor="middle" font-size="11" fill="#6b7280">Incomplete</text>
  <line x1="570" y1="208" x2="570" y2="240" stroke="#e5e7eb"/>
  <text x="630" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#111827">89%</text>
  <text x="630" y="236" text-anchor="middle" font-size="11" fill="#6b7280">Completion</text>
  <line x1="680" y1="208" x2="680" y2="240" stroke="#e5e7eb"/>
  <text x="750" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#4f46e5">58</text>
  <text x="750" y="236" text-anchor="middle" font-size="11" fill="#6b7280">Story pts</text>
  <!-- Incomplete tasks section -->
  <text x="354" y="278" font-size="13" font-weight="700" fill="#374151">5 incomplete tasks — what should we do?</text>
  <!-- Option 1 — Move to Backlog -->
  <rect x="354" y="288" width="492" height="52" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="378" cy="314" r="12" fill="#4f46e5"/>
  <circle cx="378" cy="314" r="5" fill="#ffffff"/>
  <text x="400" y="310" font-size="13" font-weight="600" fill="#111827">Move all to Backlog</text>
  <text x="400" y="328" font-size="11" fill="#6b7280">Tasks return to backlog for re-grooming</text>
  <!-- Option 2 — Move to next sprint -->
  <rect x="354" y="346" width="492" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="378" cy="372" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="400" y="368" font-size="13" font-weight="600" fill="#111827">Move all to Q2 Sprint 5</text>
  <text x="400" y="386" font-size="11" fill="#6b7280">Automatically carried into next sprint</text>
  <!-- Option 3 — Choose per task -->
  <rect x="354" y="404" width="492" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="378" cy="430" r="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="400" y="426" font-size="13" font-weight="600" fill="#111827">Choose per task</text>
  <text x="400" y="444" font-size="11" fill="#6b7280">Decide individually for each incomplete task</text>
  <!-- Warning -->
  <rect x="354" y="468" width="492" height="40" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="374" y="493" font-size="12" fill="#92400e">⚠  This action cannot be undone. Sprint will be archived.</text>
  <!-- Retrospective toggle -->
  <rect x="354" y="516" width="492" height="40" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="374" y="541" font-size="12" fill="#374151">Start retrospective after closing</text>
  <rect x="786" y="524" width="44" height="24" rx="12" fill="#4f46e5"/>
  <circle cx="802" cy="536" r="10" fill="#ffffff"/>
  <!-- Buttons -->
  <rect x="354" y="568" width="236" height="44" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="472" y="595" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Cancel</text>
  <rect x="610" y="568" width="236" height="44" rx="10" fill="#7c3aed"/>
  <text x="728" y="595" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Close Sprint</text>
</svg>
