<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f3f4f6"/>
  <rect x="0" y="0" width="220" height="750" fill="#1e2130"/>
  <text x="28" y="36" font-size="14" font-weight="700" fill="#ffffff">CGen PM</text>
  <text x="28" y="90" font-size="12" fill="#94a3b8" letter-spacing="0.05em">DELIVERY</text>
  <rect x="16" y="100" width="188" height="36" rx="8" fill="#4f46e5" opacity="0.2"/>
  <text x="36" y="124" font-size="13" font-weight="600" fill="#818cf8">💬  Chat</text>
  <text x="36" y="162" font-size="13" fill="#64748b">📋  Tasks</text>
  <text x="36" y="198" font-size="13" fill="#64748b">🏃  Sprints</text>
  <!-- Top bar -->
  <rect x="220" y="0" width="980" height="56" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="248" y="22" font-size="12" fill="#9ca3af">Delivery /</text>
  <text x="310" y="22" font-size="12" font-weight="600" fill="#111827">Chat — Q2 Sprint 4</text>
  <rect x="994" y="14" width="80" height="28" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="1034" y="33" text-anchor="middle" font-size="12" fill="#6b7280">Roster</text>
  <rect x="1084" y="14" width="80" height="28" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="1124" y="33" text-anchor="middle" font-size="12" fill="#6b7280">Tracker</text>
  <!-- Filter tabs -->
  <rect x="220" y="56" width="980" height="44" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="240" y="68" width="48" height="28" rx="6" fill="#eef2ff"/>
  <text x="264" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#4f46e5">All</text>
  <text x="318" y="87" font-size="12" fill="#6b7280">Mentions</text>
  <text x="406" y="87" font-size="12" fill="#6b7280">Mandatory</text>
