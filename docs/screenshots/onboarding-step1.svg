<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#f0f2f5"/>
  <!-- Centered modal overlay -->
  <rect width="1200" height="750" fill="#1e2130" opacity="0.55"/>
  <!-- Modal card -->
  <rect x="360" y="110" width="480" height="530" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#0003"/>
    </filter>
  </defs>
  <!-- Modal header -->
  <rect x="360" y="110" width="480" height="72" rx="12" fill="#4f46e5"/>
  <rect x="360" y="158" width="480" height="24" fill="#4f46e5"/>
  <!-- Logo mark -->
  <rect x="384" y="130" width="32" height="32" rx="8" fill="#ffffff" opacity="0.25"/>
  <text x="400" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">C</text>
  <text x="430" y="147" font-size="15" font-weight="700" fill="#ffffff">CGen PM Platform</text>
  <text x="430" y="164" font-size="12" fill="#c7d2fe">Set up your workspace in minutes</text>
  <!-- Step indicator -->
  <circle cx="480" cy="212" r="12" fill="#4f46e5"/>
  <text x="480" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <line x1="492" y1="212" x2="516" y2="212" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="528" cy="212" r="12" fill="#e5e7eb"/>
  <text x="528" y="217" text-anchor="middle" font-size="11" fill="#9ca3af">2</text>
  <line x1="540" y1="212" x2="564" y2="212" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="576" cy="212" r="12" fill="#e5e7eb"/>
  <text x="576" y="217" text-anchor="middle" font-size="11" fill="#9ca3af">3</text>
  <line x1="588" y1="212" x2="612" y2="212" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="624" cy="212" r="12" fill="#e5e7eb"/>
  <text x="624" y="217" text-anchor="middle" font-size="11" fill="#9ca3af">4</text>
  <!-- Step labels -->
  <text x="480" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">Workspace</text>
  <text x="528" y="234" text-anchor="middle" font-size="10" fill="#9ca3af">Team</text>
  <text x="576" y="234" text-anchor="middle" font-size="10" fill="#9ca3af">Roles</text>
  <text x="624" y="234" text-anchor="middle" font-size="10" fill="#9ca3af">Sprint</text>
  <!-- Form heading -->
  <text x="600" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Create your workspace</text>
  <text x="600" y="292" text-anchor="middle" font-size="13" fill="#6b7280">This is your team's home on CGen PM Platform</text>
  <!-- Field: Workspace name -->
  <text x="384" y="322" font-size="12" font-weight="600" fill="#374151">Workspace name</text>
  <rect x="384" y="330" width="432" height="42" rx="8" fill="#f9fafb" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="356" font-size="14" fill="#111827">Acme Engineering</text>
  <rect x="396" y="336" width="2" height="30" fill="#4f46e5"/>
  <!-- Field: URL slug -->
  <text x="384" y="396" font-size="12" font-weight="600" fill="#374151">URL slug</text>
  <rect x="384" y="404" width="432" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="384" y="404" width="100" height="42" rx="0" fill="#f3f4f6"/>
  <rect x="384" y="404" width="100" height="42" rx="8" fill="#f3f4f6"/>
  <rect x="430" y="404" width="56" height="42" fill="#f3f4f6"/>
  <text x="434" y="430" font-size="12" fill="#9ca3af">meridian.app/</text>
  <text x="490" y="430" font-size="14" fill="#111827">acme-eng</text>
  <!-- Field: Plan -->
  <text x="384" y="470" font-size="12" font-weight="600" fill="#374151">Plan</text>
  <rect x="384" y="478" width="432" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="504" font-size="14" fill="#6b7280">Starter — Free up to 5 members</text>
  <!-- CTA -->
  <rect x="384" y="546" width="432" height="46" rx="10" fill="#4f46e5"/>
  <text x="600" y="574" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Continue →</text>
  <!-- Skip -->
  <text x="600" y="614" text-anchor="middle" font-size="12" fill="#9ca3af">Already have an account? <tspan fill="#4f46e5" font-weight="600">Sign in</tspan></text>
</svg>
