<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1200" height="750" fill="#f0f2f5"/>
  <rect width="1200" height="750" fill="#1e2130" opacity="0.55"/>
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#0003"/></filter></defs>
  <rect x="340" y="90" width="520" height="570" rx="12" fill="#ffffff" filter="url(#sh)"/>
  <!-- Header -->
  <rect x="340" y="90" width="520" height="72" rx="12" fill="#4f46e5"/>
  <rect x="340" y="138" width="520" height="24" fill="#4f46e5"/>
  <text x="600" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Invite your team</text>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#c7d2fe">Step 2 of 4 — Add members to your workspace</text>
  <!-- Step dots -->
  <circle cx="516" cy="187" r="10" fill="#6366f1" opacity="0.5"/>
  <circle cx="548" cy="187" r="10" fill="#4f46e5"/>
  <circle cx="580" cy="187" r="10" fill="#e5e7eb"/>
  <circle cx="612" cy="187" r="10" fill="#e5e7eb"/>
  <text x="516" y="191" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
  <text x="548" y="191" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>
  <text x="580" y="191" text-anchor="middle" font-size="9" fill="#9ca3af">3</text>
  <text x="612" y="191" text-anchor="middle" font-size="9" fill="#9ca3af">4</text>
  <!-- Email input area -->
  <text x="364" y="228" font-size="12" font-weight="600" fill="#374151">Email addresses</text>
  <text x="364" y="242" font-size="11" fill="#9ca3af">Separate multiple emails with commas or press Enter</text>
  <rect x="364" y="250" width="472" height="80" rx="8" fill="#f9fafb" stroke="#4f46e5" stroke-width="2"/>
  <!-- Email chips -->
  <rect x="374" y="260" width="148" height="26" rx="13" fill="#eef2ff"/>
  <text x="390" y="278" font-size="12" fill="#4f46e5">sara@acme.com</text>
  <text x="508" y="278" font-size="14" fill="#6366f1">×</text>
  <rect x="528" y="260" width="154" height="26" rx="13" fill="#eef2ff"/>
  <text x="544" y="278" font-size="12" fill="#4f46e5">james@acme.com</text>
  <text x="668" y="278" font-size="14" fill="#6366f1">×</text>
  <text x="374" y="310" font-size="13" fill="#9ca3af">Add another email...</text>
  <!-- Role selector -->
  <text x="364" y="352" font-size="12" font-weight="600" fill="#374151">Assign role</text>
  <rect x="364" y="360" width="472" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="380" y="386" font-size="14" fill="#111827">Member</text>
  <text x="820" y="386" font-size="12" fill="#9ca3af">▾</text>
  <!-- Pending invites list -->
  <text x="364" y="426" font-size="12" font-weight="600" fill="#374151">Pending invites</text>
  <!-- Row 1 -->
  <rect x="364" y="434" width="472" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="392" cy="460" r="16" fill="#ddd6fe"/>
  <text x="392" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">SR</text>
  <text x="418" y="454" font-size="13" font-weight="600" fill="#111827">Sara Reyes</text>
  <text x="418" y="470" font-size="11" fill="#9ca3af">sara@acme.com</text>
  <rect x="752" y="446" width="72" height="26" rx="6" fill="#eef2ff"/>
  <text x="788" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">Member</text>
  <!-- Row 2 -->
  <rect x="364" y="492" width="472" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="392" cy="518" r="16" fill="#dcfce7"/>
  <text x="392" y="523" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">JK</text>
  <text x="418" y="512" font-size="13" font-weight="600" fill="#111827">James Kim</text>
  <text x="418" y="528" font-size="11" fill="#9ca3af">james@acme.com</text>
  <rect x="752" y="504" width="72" height="26" rx="6" fill="#eef2ff"/>
  <text x="788" y="522" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">Member</text>
  <!-- Actions -->
  <rect x="364" y="574" width="228" height="46" rx="10" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="478" y="602" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">← Back</text>
  <rect x="608" y="574" width="228" height="46" rx="10" fill="#4f46e5"/>
  <text x="722" y="602" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Send Invites →</text>
  <!-- Skip link -->
  <text x="600" y="640" text-anchor="middle" font-size="12" fill="#9ca3af">Skip for now</text>
</svg>
