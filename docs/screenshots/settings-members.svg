  <circle cx="268" cy="530" r="16" fill="#fef3c7"/>
  <text x="268" y="535" text-anchor="middle" font-size="14">✉</text>
  <text x="292" y="524" font-size="13" font-weight="600" fill="#92400e">chen@acme.com</text>
  <text x="292" y="540" font-size="11" fill="#d97706">Invite pending</text>
  <text x="580" y="532" font-size="12" fill="#9ca3af">chen@acme.com</text>
  <rect x="780" y="518" width="76" height="26" rx="6" fill="#fef3c7"/>
  <text x="818" y="535" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">Member</text>
  <text x="920" y="532" font-size="12" fill="#9ca3af">Sent 1d ago</text>
  <text x="1140" y="532" text-anchor="end" font-size="12" fill="#4f46e5">Resend</text>
  <!-- Role description -->
  <rect x="240" y="572" width="940" height="130" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="260" y="596" font-size="13" font-weight="700" fill="#111827">Workspace Roles</text>
  <text x="260" y="620" font-size="12" fill="#374151"><tspan font-weight="700">Owner:</tspan> Everything, including deleting the workspace</text>
  <text x="260" y="640" font-size="12" fill="#374151"><tspan font-weight="700">Admin:</tspan> Invite/remove members, change roles, manage settings</text>
  <text x="260" y="660" font-size="12" fill="#374151"><tspan font-weight="700">Member:</tspan> Create and edit tasks, plan sprints, participate in chat</text>
  <text x="260" y="680" font-size="12" fill="#374151"><tspan font-weight="700">Viewer:</tspan> Read-only access to all content</text>
</svg>
