  <text x="580" y="428" font-size="12" fill="#374151">ravi@acme.com</text>
  <rect x="780" y="414" width="120" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="840" y="433" text-anchor="middle" font-size="12" fill="#374151">Member  ▾</text>
