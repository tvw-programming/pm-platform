  <rect x="240" y="348" width="940" height="52" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="268" cy="374" r="16" fill="#dbeafe"/>
  <text x="268" y="379" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">JK</text>
  <text x="292" y="368" font-size="13" font-weight="600" fill="#111827">James Kim</text>
  <text x="580" y="376" font-size="12" fill="#374151">james@acme.com</text>
  <rect x="780" y="362" width="120" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
