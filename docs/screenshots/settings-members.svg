  <rect x="240" y="452" width="940" height="52" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="268" cy="478" r="16" fill="#f3f4f6"/>
  <text x="268" y="483" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">LW</text>
  <text x="292" y="472" font-size="13" font-weight="600" fill="#111827">Ling Wei</text>
  <text x="580" y="480" font-size="12" fill="#374151">ling@acme.com</text>
